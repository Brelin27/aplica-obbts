<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Recuperação - ChatBBTS</title>
  <link rel="stylesheet" href="recuperacao.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <!-- Lado esquerdo com imagem do aplicativo -->
    <div class="left-panel">
      <img src="./image.png" alt="App Banco do Brasil" class="phone-image" />
    </div>

    <!-- Lado direito com logo e formulário de recuperação -->
    <div class="right-panel">
      <img src="./logo.png" alt="Logo BBTS" class="logo" />
      <h2>← ChatBBTS Recuperação</h2>

      <form class="form" action="#" method="post">
        <label for="email">Digite seu e-mail para continuar o processo de recuperação da conta:</label>
        <input type="email" id="email" name="email" placeholder="Digite seu e-mail..." required />

        <button type="submit" class="btn-acessar">
          Enviar <span class="arrow">→</span>
        </button>
      </form>
    </div>
  </div>
</body>
</html>
