<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login - ChatBBTS</title>
  <link rel="stylesheet" href="login.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <!-- Lado esquerdo com imagem do aplicativo -->
    <div class="left-panel">
      <img src="./image.png" alt="App Banco do Brasil" class="phone-image" />
    </div>

    <!-- Lado direito com logo e formulário de login -->
    <div class="right-panel">
      <img src="./logo.png" alt="Logo BBTS" class="logo" />
      <h2>ChatBBTS Login</h2>

      <form class="form" action="#" method="post">
        <label for="email">E-mail:</label>
        <input type="email" id="email" name="email" placeholder="Digite seu e-mail..." required />

        <label for="senha">Senha:</label>
        <input type="password" id="senha" name="senha" placeholder="Digite sua senha..." required />

        <button type="submit" class="btn-acessar">
          Logar <span class="arrow">→</span>
        </button>

       <div class="links">
  <button class="link-button">Esqueceu a senha?</button>
  <button class="link-button">Cadastre-se!</button>
</div>

      </form>
    </div>
  </div>
</body>
</html>
